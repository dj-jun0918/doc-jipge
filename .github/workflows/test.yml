name: Test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docjipge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run migrations and pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/docjipge
          TEST_DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/docjipge_test
        run: |
          cd backend
          alembic upgrade head
          pytest tests -v
