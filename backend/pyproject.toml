[project]
name = "doc-jipge"
version = "0.1.0"
description = "정부지원사업 자격요건 투명 검증 시스템"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "sqlalchemy>=2.0.40",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.0",
    # Async task queue
    "celery>=5.4.0",
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.28.0",
    # FastAPI file upload
    "python-multipart>=0.0.18",
    # Web scraping
    "playwright>=1.49.1",
    "python-hwpx>=2.9.1",
    # PDF processing
    "pymupdf>=1.25.0",
    # LLM APIs
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    # Validation & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Retry
    "tenacity>=9.0.0",
    # Excel export
    "openpyxl>=3.1.0",
    # Machine Learning
    "scikit-learn>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: 실 API 호출 통합 테스트 (느림, 수동 실행)",
]
# 기본 스위트에서 느린 라이브 e2e 제외 (단위 회귀 신호 보존). 실행하려면 `pytest -m e2e`.
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
pythonpath = [".."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120
